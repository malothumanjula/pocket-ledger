<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Pocket Ledger</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .auth-card h1 {
      color: var(--primary);
      margin-bottom: 0.5rem;
    }
    .auth-card p {
      color: var(--text-muted);
      margin-bottom: 2rem;
    }
    .error-msg {
      color: var(--danger);
      background: rgba(239, 68, 68, 0.1);
      padding: 0.75rem;
      border-radius: var(--border-radius-sm);
      margin-bottom: 1rem;
      font-size: 0.875rem;
      display: none;
    }
    .form-group { text-align: left; }
  </style>
</head>
<body>
  <div class="auth-container">
    <div class="card glass auth-card animate-fade-in">
      <h1>Pocket Ledger</h1>
      <p>Sign in to manage your finances</p>
      
      <div id="error-msg" class="error-msg"></div>
      
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" class="form-control" required autofocus placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" class="form-control" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-full mt-4">Log In</button>
      </form>
      
      <div class="mt-4" style="font-size: 0.875rem;">
        Don't have an account? <a href="/register.html">Sign up</a>
      </div>
    </div>
  </div>

  <script src="./js/api.js"></script>
  <script src="./js/auth.js"></script>
</body>
</html>
