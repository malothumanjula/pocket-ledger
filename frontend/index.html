<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Pocket Ledger</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="container">
        <nav class="navbar">
            <div class="navbar-brand">
                Pocket Ledger
            </div>
            <div class="navbar-nav">
                <input type="month" id="month-selector" class="form-control" style="width: auto;">
                <button id="theme-toggle" class="btn btn-outline">Theme</button>
                <button id="logout-btn" class="btn btn-outline">Logout</button>
            </div>
        </nav>

        <div class="flex justify-between items-center mb-6">
            <h1 id="greeting">Welcome Back</h1>
            <button id="add-expense-btn" class="btn btn-primary">+ Add Expense</button>
        </div>

        <!-- Summary Cards -->
        <div class="dashboard-grid mb-8">
            <div class="dashboard-card-md">
                <div class="card glass">
                    <p class="text-muted">Total Spending</p>
                    <h2 id="total-spending">...</h2>
                </div>
            </div>
            <div class="dashboard-card-md">
                <div class="card glass">
                    <p class="text-muted">Total Budget</p>
                    <h2 id="total-budget">...</h2>
                </div>
            </div>
            <div class="dashboard-card-md">
                <div class="card glass">
                    <p class="text-muted">Remaining</p>
                    <h2 id="remaining-budget">...</h2>
                </div>
            </div>
        </div>

        <div class="dashboard-grid mb-8">
            <div class="dashboard-card-xl">
                <div class="card glass h-full">
                    <h3>6-Month Trend</h3>
                    <div style="height: 300px; width: 100%; position: relative; margin-top: 1rem;">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
            </div>
            <div class="dashboard-card-sm">
                <div class="card glass h-full">
                    <h3>Category Breakdown</h3>
                    <div style="height: 300px; width: 100%; position: relative; margin-top: 1rem;">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- Recent Transactions -->
            <div class="dashboard-card-lg">
                <div class="card glass">
                    <div class="flex justify-between items-center mb-4">
                        <h3>Recent Transactions</h3>
                        <button id="view-all-expenses" class="btn btn-outline"
                            style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">View All</button>
                    </div>
                    <div style="overflow-x: auto;">
                        <table id="transactions-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Category</th>
                                    <th>Note</th>
                                    <th>Amount</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- Budgets -->
            <div class="dashboard-card-lg">
                <div class="card glass">
                    <div class="flex justify-between items-center mb-4">
                        <h3>Category Budgets</h3>
                        <button id="add-budget-btn" class="btn btn-outline"
                            style="padding: 0.25rem 0.5rem; font-size: 0.75rem;">+ Add Budget</button>
                    </div>
                    <div id="budgets-list">
                        <!-- Populated by JS -->
                    </div>
                </div>
            </div>
        </div>
        <br><br>
    </div>

    <!-- Add Expense Modal -->
    <div id="expense-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="expense-modal-title">Add Expense</h3>
                <button class="modal-close"
                    onclick="document.getElementById('expense-modal').classList.remove('active')">&times;</button>
            </div>
            <form id="expense-form">
                <input type="hidden" id="expense-id">
                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" id="expense-amount" class="form-control" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="expense-date" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="expense-category" class="form-control" required>
                        <option value="Housing">Housing</option>
                        <option value="Food & Dining">Food & Dining</option>
                        <option value="Transport">Transport</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Health">Health</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Note</label>
                    <input type="text" id="expense-note" class="form-control">
                </div>
                <button type="submit" class="btn btn-primary w-full">Save Expense</button>
            </form>
        </div>
    </div>

    <!-- Add Budget Modal -->
    <div id="budget-modal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>Manage Budget</h3>
                <button class="modal-close"
                    onclick="document.getElementById('budget-modal').classList.remove('active')">&times;</button>
            </div>
            <form id="budget-form">
                <div class="form-group">
                    <label>Category</label>
                    <select id="budget-category" class="form-control" required>
                        <option value="Housing">Housing</option>
                        <option value="Food & Dining">Food & Dining</option>
                        <option value="Transport">Transport</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Health">Health</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Monthly Amount</label>
                    <input type="number" id="budget-amount" class="form-control" step="0.01" required>
                </div>
                <button type="submit" class="btn btn-primary w-full">Save Budget</button>
            </form>
        </div>
    </div>

    <!-- Added Chart.js directly as requested -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/app.js"></script>
    <script src="./js/dashboard.js"></script>
</body>

</html>
